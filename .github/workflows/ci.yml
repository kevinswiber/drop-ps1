name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint and test (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show the runner's own token
        shell: pwsh
        run: |
          # Lets the log show whether the tests start from an elevated token.
          whoami /groups | Select-String 'BUILTIN\\Administrators|Mandatory Level'

      # Same tasks a contributor runs locally; see build.ps1.
      - name: Lint with PSScriptAnalyzer
        shell: pwsh
        run: ./build.ps1 Lint

      - name: Test with Pester
        shell: pwsh
        run: ./build.ps1 Test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pester-results
          path: testResults.xml

  non-windows:
    name: Refuses to run elsewhere (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: drop.ps1 exits 1 with a clear message off Windows
        shell: pwsh
        run: |
          $err = & pwsh -NoProfile -File ./bin/drop.ps1 whoami 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Information "exit=$code`n$err" -InformationAction Continue
          if ($code -ne 1) { throw "expected exit code 1, got $code" }
          if ($err -notmatch 'drop: Windows only') { throw "expected the Windows-only message" }
          exit 0   # the step wrapper would otherwise reuse drop's deliberate exit 1
