name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint and test (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show the runner's own token
        shell: pwsh
        run: |
          # Lets the log show whether the tests start from an elevated token.
          whoami /groups | Select-String 'BUILTIN\\Administrators|Mandatory Level'

      # Same tasks a contributor runs locally; see build.ps1.
      - name: Lint with PSScriptAnalyzer
        shell: pwsh
        run: ./build.ps1 Lint

      - name: Test with Pester
        shell: pwsh
        run: ./build.ps1 Test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pester-results
          path: testResults.xml
